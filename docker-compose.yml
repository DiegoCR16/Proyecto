services:
  db:
    image: postgres:15-alpine
    container_name: global-exchange-db
    environment:
      POSTGRES_DB: globalexchange
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d globalexchange"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: global-exchange-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./docker:/opt/keycloak/data/import
    command: start-dev --import-realm --hostname-strict=false

  mailpit:
    image: axllent/mailpit:latest
    container_name: global-exchange-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  web:
    build: .
    container_name: global-exchange-web
    command: ./entrypoint.sh
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-*^pm7b%^e43^9+r^v7oo8lxlzh7z6n@hx65rypp*cwm$8kf(3r
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=globalexchange
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - KEYCLOAK_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_FRONTEND_URL=http://localhost:8080
      - KEYCLOAK_REALM=global-exchange-realm
      - KEYCLOAK_CLIENT_ID=global-exchange-client
      - KEYCLOAK_CLIENT_SECRET=YxgDli07yoW5jMdpZrdgu4NX2Mpxi5zc
      - KEYCLOAK_REDIRECT_URI=http://localhost:8000/auth/callback/
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  postgres_data:
  keycloak_data:
