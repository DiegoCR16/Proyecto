<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Exchange - Verificación iToken / MFA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md mx-4 border border-slate-100">
        <!-- Encabezado -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-800 text-white rounded-full mb-3 text-xl font-bold shadow-sm">
                🔒
            </div>
            <h1 class="text-2xl font-bold text-slate-900">Verificación iToken / MFA</h1>
            <p class="text-sm text-slate-600 mt-1">Su rol o clasificación requiere validación de doble factor de seguridad.</p>
        </div>

        {% if error %}
            <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm text-center font-medium">
                {{ error }}
            </div>
        {% endif %}

        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Código iToken (6 dígitos):</label>
                <input type="text" name="itoken_code" required maxlength="6" placeholder="Ej: 123456"
                       class="w-full px-4 py-2.5 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-800 focus:border-blue-800 text-center tracking-widest text-lg font-semibold">
                <p class="text-xs text-slate-500 mt-1 text-center">Para pruebas, ingrese: <strong>123456</strong></p>
            </div>
            <button type="submit" 
                    class="w-full py-2.5 px-4 bg-blue-800 text-white font-semibold rounded-lg shadow hover:bg-blue-900 transition duration-200">
                Verificar iToken
            </button>
        </form>
    </div>
</body>
</html>
