<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar ser Cliente - Global Exchange</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-lg border border-slate-200">
        <!-- Encabezado -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-800 text-white rounded-xl mb-3 text-2xl font-bold shadow-md">
                GX
            </div>
            <h1 class="text-2xl font-bold text-slate-900">Global Exchange</h1>
            <p class="text-sm text-slate-600 mt-1">Solicitud de Registro como Cliente (Persona Física o Jurídica)</p>
        </div>

        {% if error %}
            <div class="mb-6 p-4 bg-red-50 border-l-4 border-red-600 text-red-700 rounded-r-lg text-sm shadow-sm" role="alert">
                <span class="font-semibold">Atención:</span> {{ error }}
            </div>
        {% endif %}

        {% if success %}
            <div class="mb-6 p-4 bg-green-50 border-l-4 border-green-600 text-green-700 rounded-r-lg text-sm shadow-sm" role="alert">
                <span class="font-semibold">Éxito:</span> {{ success }}
            </div>
        {% endif %}

        <!-- Formulario -->
        <form method="POST" action="{% url 'register' %}" class="space-y-5">
            {% csrf_token %}
            
            <div>
                <label for="client_name" class="block text-sm font-medium text-slate-700 mb-1">Nombre Completo o Razón Social</label>
                <input type="text" id="client_name" name="client_name" value="{{ client_name|default:'' }}" required
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 text-slate-900"
                       placeholder="Ej. Juan Pérez o Empresa S.A.">
            </div>

            <div>
                <label for="ci_ruc" class="block text-sm font-medium text-slate-700 mb-1">Cédula de Identidad o RUC</label>
                <input type="text" id="ci_ruc" name="ci_ruc" value="{{ ci_ruc|default:'' }}" required
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 text-slate-900"
                       placeholder="Ej. 1234567 o 80012345-6">
            </div>

            <div>
                <label for="client_type" class="block text-sm font-medium text-slate-700 mb-1">Naturaleza del Cliente</label>
                <select id="client_type" name="client_type" required
                        class="w-full px-4 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 text-slate-900 bg-white">
                    <option value="FISICA" {% if client_type == 'FISICA' %}selected{% endif %}>Persona Física</option>
                    <option value="JURIDICA" {% if client_type == 'JURIDICA' %}selected{% endif %}>Persona Jurídica (Empresa)</option>
                </select>
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico de Contacto</label>
                <input type="email" id="email" name="email" value="{{ email|default:'' }}" required
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 text-slate-900"
                       placeholder="cliente@dominio.com">
            </div>

            <div>
                <button type="submit" 
                        class="w-full flex items-center justify-center py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition duration-200">
                    Enviar Solicitud de Creación de Grupo Cliente
                </button>
            </div>
        </form>

        <div class="mt-6 text-center text-sm">
            <a href="{% url 'dashboard_redirect' %}" class="font-medium text-blue-600 hover:text-blue-800">&larr; Volver al Panel</a>
        </div>
    </div>
</body>
</html>
