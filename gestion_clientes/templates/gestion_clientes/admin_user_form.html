<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if edit_mode %}Editar Usuario{% else %}Crear Usuario{% endif %} - Global Exchange</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-lg border border-slate-200">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-800 text-white rounded-xl mb-3 text-2xl font-bold shadow-md">
                GX
            </div>
            <h1 class="text-2xl font-bold text-slate-900">{% if edit_mode %}Editar Usuario{% else %}Crear Nuevo Usuario{% endif %}</h1>
            <p class="text-sm text-slate-600 mt-1">Gestión de cuentas y asignación de roles en Global Exchange</p>
        </div>

        {% if error %}
            <div class="mb-6 p-4 bg-red-50 border-l-4 border-red-600 text-red-700 rounded-r-lg text-sm shadow-sm" role="alert">
                <span class="font-semibold">Atención:</span> {{ error }}
            </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nombre de Usuario (Username)</label>
                <input type="text" name="username" value="{{ target_user.username|default:'' }}" required
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-600 text-slate-900">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
                <input type="email" name="email" value="{{ target_user.email|default:'' }}" required
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-600 text-slate-900">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña {% if edit_mode %}(Dejar en blanco para mantener actual){% endif %}</label>
                <input type="password" name="password" {% if not edit_mode %}required{% endif %}
                       class="w-full px-4 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-600 text-slate-900"
                       placeholder="••••••••">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Rol Principal</label>
                <select name="role_id" class="w-full px-4 py-2 border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-600 bg-white text-slate-900">
                    <option value="">-- Sin Rol Principal --</option>
                    {% for r in all_roles %}
                        <option value="{{ r.id }}" {% if target_user.profile.role and target_user.profile.role.id == r.id %}selected{% endif %}>{{ r.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Roles Múltiples Adicionales</label>
                <div class="space-y-2 max-h-40 overflow-y-auto p-3 border border-slate-200 rounded-lg bg-slate-50">
                    {% for r in all_roles %}
                    <label class="flex items-center space-x-2 text-sm text-slate-700 cursor-pointer">
                        <input type="checkbox" name="additional_roles" value="{{ r.id }}" {% if r in target_user.profile.roles.all %}checked{% endif %} class="rounded text-blue-600 focus:ring-blue-500">
                        <span>{{ r.name }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <input type="checkbox" name="is_active" id="is_active" {% if not edit_mode or target_user.is_active %}checked{% endif %} class="rounded text-blue-600 focus:ring-blue-500">
                <label for="is_active" class="text-sm font-medium text-slate-700">Usuario Activo</label>
            </div>

            <div>
                <button type="submit" class="w-full flex items-center justify-center py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition duration-200">
                    {% if edit_mode %}Guardar Cambios{% else %}Crear Usuario{% endif %}
                </button>
            </div>
        </form>

        <div class="mt-6 text-center text-sm">
            <a href="{% url 'admin_user_list' %}" class="font-medium text-blue-600 hover:text-blue-800">&larr; Volver al Listado de Usuarios</a>
        </div>
    </div>
</body>
</html>
